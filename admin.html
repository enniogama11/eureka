<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Eureka Lounge</title>
    <link rel="icon" href="img/eurea.png" type="image/png">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.0/src/bold/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #ffd700;
            --bg: #000000;
            --card-bg: #111111;
            --gradient: linear-gradient(135deg, #d4af37 0%, #ffd700 100%);
            --green: #25d366;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 25% 25%, rgba(212, 175, 55, 0.1) 0%, transparent 50%),
                              radial-gradient(circle at 75% 75%, rgba(212, 175, 55, 0.05) 0%, transparent 50%);
            color: var(--gold);
            font-family: 'Roboto', sans-serif;
            padding: 20px;
            line-height: 1.6;
            font-size: 16px;
            min-height: 100vh;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .admin-header h1 {
            font-family: 'Playfair Display', serif;
            color: var(--gold-light);
            font-size: 2.5rem;
        }

        .admin-header a {
            background: var(--gradient);
            color: #000;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
        }

        .admin-header a:hover {
            transform: scale(1.05);
        }

        .admin-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
        }

        .sidebar {
            background: linear-gradient(145deg, var(--card-bg) 0%, #1a1a1a 100%);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 15px;
            padding: 20px;
        }

        .sidebar h2 {
            color: var(--gold-light);
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .category-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .category-item {
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .category-item:hover,
        .category-item.active {
            background: var(--gradient);
            color: #000;
            border-color: var(--gold-light);
        }

        .main-content {
            background: linear-gradient(145deg, var(--card-bg) 0%, #1a1a1a 100%);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 15px;
            padding: 25px;
        }

        .section-title {
            color: var(--gold-light);
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-family: 'Playfair Display', serif;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: var(--gold);
            margin-bottom: 5px;
            font-weight: 600;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            color: var(--gold);
            font-family: 'Roboto', sans-serif;
            transition: all 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            background: rgba(212, 175, 55, 0.1);
            border-color: var(--gold-light);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            flex: 1;
        }

        .btn-save {
            background: var(--gradient);
            color: #000;
        }

        .btn-save:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }

        .btn-delete {
            background: #ff4444;
            color: white;
        }

        .btn-delete:hover {
            background: #cc0000;
        }

        .btn-cancel {
            background: rgba(212, 175, 55, 0.2);
            color: var(--gold);
        }

        .btn-cancel:hover {
            background: rgba(212, 175, 55, 0.3);
        }

        .products-list {
            display: grid;
            gap: 15px;
            max-height: 600px;
            overflow-y: auto;
        }

        .product-item {
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .product-item:hover {
            background: rgba(212, 175, 55, 0.1);
            border-color: var(--gold-light);
        }

        .product-item.selected {
            background: var(--gradient);
            color: #000;
        }

        .product-info {
            flex: 1;
        }

        .product-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .product-price {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .product-actions {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 8px 12px;
            font-size: 0.9rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-edit {
            background: var(--gradient);
            color: #000;
        }

        .btn-remove {
            background: #ff4444;
            color: white;
        }

        .btn-remove:hover {
            background: #cc0000;
        }

        .success-message {
            background: var(--green);
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .admin-content {
                grid-template-columns: 1fr;
            }

            .admin-header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .admin-header a {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>🔧 Painel Admin</h1>
            <div style="display: flex; gap: 10px;">
                <a href="index.html">← Voltar ao Menu</a>
                <button onclick="logout()" style="background: #ff4444; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.3s;">🔒 Logout</button>
            </div>
        </div>

        <div class="success-message" id="successMessage">
            ✓ Alterações salvas com sucesso!
        </div>

        <div class="admin-content">
            <!-- Sidebar -->
            <div class="sidebar">
                <h2>Categorias</h2>
                <div class="category-list" id="categoryList"></div>

                <h2 style="margin-top: 30px;">Produtos</h2>
                <div class="products-list" id="productsList"></div>
            </div>

            <!-- Main Content -->
            <div class="main-content">
                <h2 class="section-title">Editar Produto</h2>

                <div class="form-group">
                    <label>Nome do Produto</label>
                    <input type="text" id="productName" placeholder="Ex: Muamba de Galinha">
                </div>

                <div class="form-group">
                    <label>Preço (Kz)</label>
                    <input type="number" id="productPrice" placeholder="Ex: 3500" min="0">
                </div>

                <div class="form-group">
                    <label>Descrição</label>
                    <textarea id="productDescription" placeholder="Descrição do produto"></textarea>
                </div>

                <div class="form-group">
                    <label>URL da Imagem</label>
                    <input type="text" id="productImage" placeholder="https://example.com/image.jpg">
                </div>

                <div class="form-group">
                    <label>Categoria</label>
                    <select id="productCategory">
                        <!-- Preenchido dinamicamente -->
                    </select>
                </div>

                <div class="form-group">
                    <label>Itens Adicionais (um por linha, formato: Nome - Preço)</label>
                    <textarea id="productItems" placeholder="Sopa - 1500&#10;Azeitonas ao Alho - 1500"></textarea>
                </div>

                <div class="button-group">
                    <button class="btn-save" onclick="saveProduct()">💾 Salvar</button>
                    <button class="btn-delete" onclick="deleteProduct()" id="deleteBtn" style="display: none;">🗑️ Deletar</button>
                    <button class="btn-cancel" onclick="resetForm()">✕ Cancelar</button>
                </div>

                <h2 class="section-title" style="margin-top: 40px;">Novo Produto</h2>
                <button class="btn-save" onclick="addNewProduct()" style="width: 100%;">➕ Adicionar Novo Produto</button>
            </div>
        </div>
    </div>

    <script>
        // Verificar autenticação
        function checkAuth() {
            const auth = sessionStorage.getItem('eurekAdminAuth');
            const authTime = sessionStorage.getItem('eurekAdminTime');
            const currentTime = Date.now();
            const sessionTimeout = 24 * 60 * 60 * 1000; // 24 horas

            if (!auth || !authTime || (currentTime - parseInt(authTime)) > sessionTimeout) {
                // Sessão expirada ou não autenticado
                window.location.href = 'admin-login.html';
                return false;
            }
            return true;
        }

        // Verificar autenticação ao carregar
        if (!checkAuth()) {
            document.body.innerHTML = '';
        }

        // Função para logout
        function logout() {
            sessionStorage.removeItem('eurekAdminAuth');
            sessionStorage.removeItem('eurekAdminTime');
            window.location.href = 'admin-login.html';
        }

        let menuData = null;
        let selectedProductId = null;
        let selectedCategoryId = null;

        // Carregar dados
        async function loadMenu() {
            try {
                const response = await fetch('data/menu.json');
                menuData = await response.json();
                renderCategories();
                renderProducts();
                renderCategorySelect();
            } catch (error) {
                console.error('Erro ao carregar menu:', error);
            }
        }

        // Renderizar categorias
        function renderCategories() {
            const categoryList = document.getElementById('categoryList');
            categoryList.innerHTML = '';

            menuData.categories.forEach((category, index) => {
                const item = document.createElement('div');
                item.className = `category-item ${index === 0 ? 'active' : ''}`;
                item.textContent = `${category.emoji} ${category.name}`;
                item.onclick = () => selectCategory(category.id, item);
                categoryList.appendChild(item);
            });

            selectedCategoryId = menuData.categories[0].id;
        }

        // Selecionar categoria
        function selectCategory(categoryId, element) {
            document.querySelectorAll('.category-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
            selectedCategoryId = categoryId;
            renderProducts();
        }

        // Renderizar produtos
        function renderProducts() {
            const productsList = document.getElementById('productsList');
            productsList.innerHTML = '';

            const products = menuData.products.filter(p => p.category === selectedCategoryId);

            products.forEach(product => {
                const item = document.createElement('div');
                item.className = 'product-item';
                item.innerHTML = `
                    <div class="product-info">
                        <div class="product-name">${product.name}</div>
                        <div class="product-price">${product.price.toLocaleString('pt-AO')} Kz</div>
                    </div>
                    <div class="product-actions">
                        <button class="btn-small btn-edit" onclick="editProduct(${product.id})">Editar</button>
                    </div>
                `;
                productsList.appendChild(item);
            });
        }

        // Editar produto
        function editProduct(productId) {
            const product = menuData.products.find(p => p.id === productId);
            if (!product) return;

            selectedProductId = productId;

            document.getElementById('productName').value = product.name;
            document.getElementById('productPrice').value = product.price;
            document.getElementById('productDescription').value = product.description || '';
            document.getElementById('productImage').value = product.image || '';
            document.getElementById('productCategory').value = product.category;

            // Converter items para formato de texto
            const itemsText = product.items
                .map(item => `${item.name} - ${item.price}`)
                .join('\n');
            document.getElementById('productItems').value = itemsText;

            document.getElementById('deleteBtn').style.display = 'block';
        }

        // Salvar produto
        function saveProduct() {
            if (!selectedProductId) {
                alert('Selecione um produto para editar');
                return;
            }

            const product = menuData.products.find(p => p.id === selectedProductId);
            if (!product) return;

            // Atualizar dados
            product.name = document.getElementById('productName').value;
            product.price = parseInt(document.getElementById('productPrice').value);
            product.description = document.getElementById('productDescription').value;
            product.image = document.getElementById('productImage').value;
            product.category = document.getElementById('productCategory').value;

            // Parsear items
            const itemsText = document.getElementById('productItems').value;
            product.items = itemsText
                .split('\n')
                .filter(line => line.trim())
                .map(line => {
                    const [name, price] = line.split(' - ');
                    return {
                        name: name.trim(),
                        price: parseInt(price.trim())
                    };
                });

            // Salvar no localStorage
            localStorage.setItem('eurekMenuData', JSON.stringify(menuData));

            showSuccess();
            renderProducts();
        }

        // Deletar produto
        function deleteProduct() {
            if (!selectedProductId) return;

            if (!confirm('Tem certeza que quer deletar este produto?')) return;

            menuData.products = menuData.products.filter(p => p.id !== selectedProductId);
            localStorage.setItem('eurekMenuData', JSON.stringify(menuData));

            showSuccess();
            resetForm();
            renderProducts();
        }

        // Adicionar novo produto
        function addNewProduct() {
            const newId = Math.max(...menuData.products.map(p => p.id), 0) + 1;

            const newProduct = {
                id: newId,
                category: selectedCategoryId,
                name: 'Novo Produto',
                price: 0,
                image: '',
                description: '',
                items: []
            };

            menuData.products.push(newProduct);
            localStorage.setItem('eurekMenuData', JSON.stringify(menuData));

            selectedProductId = newId;
            renderProducts();
            editProduct(newId);
        }

        // Resetar formulário
        function resetForm() {
            document.getElementById('productName').value = '';
            document.getElementById('productPrice').value = '';
            document.getElementById('productDescription').value = '';
            document.getElementById('productImage').value = '';
            document.getElementById('productItems').value = '';
            document.getElementById('deleteBtn').style.display = 'none';
            selectedProductId = null;
        }

        // Renderizar select de categorias
        function renderCategorySelect() {
            const select = document.getElementById('productCategory');
            select.innerHTML = '';

            menuData.categories.forEach(category => {
                const option = document.createElement('option');
                option.value = category.id;
                option.textContent = `${category.emoji} ${category.name}`;
                select.appendChild(option);
            });
        }

        // Mostrar mensagem de sucesso
        function showSuccess() {
            const msg = document.getElementById('successMessage');
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 3000);
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', loadMenu);
    </script>
</body>
</html>
