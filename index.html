<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eureka Lounge - Menu Digital</title>
    <link rel="icon" href="img/eurea.png" type="image/png">
    <link rel="shortcut icon" href="img/eurea.png" type="image/png">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.0/src/bold/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-top">
            <img src="img/eurea.png" alt="Eureka Lounge Logo" class="logo">
            <div class="header-buttons">
                <button id="qrBtn" class="btn-icon" title="QR Code">
                    <i class="ph-bold ph-qr-code"></i>
                </button>
                <button id="adminBtn" class="btn-icon" title="Administração">
                    <i class="ph-bold ph-gear"></i>
                </button>
                <button id="cartBtn" class="btn-cart" title="Carrinho">
                    <i class="ph-bold ph-shopping-cart"></i>
                    <span class="cart-count">0</span>
                </button>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="search-container">
            <input 
                type="text" 
                id="searchInput" 
                class="search-input" 
                placeholder="🔍 Pesquisar pratos, bebidas..."
            >
        </div>

        <!-- Categories Navigation -->
        <nav class="categories-nav" id="categoriesNav"></nav>
    </header>

    <!-- Main Content -->
    <main id="mainContent">
        <!-- Categories will be dynamically loaded here -->
    </main>

    <!-- Cart Sidebar -->
    <div id="cartSidebar" class="cart-sidebar">
        <div class="cart-header">
            <h2>Seu Pedido</h2>
            <button id="closeCart" class="close-btn">✕</button>
        </div>
        <div id="cartItems" class="cart-items"></div>
        <div class="cart-footer">
            <div class="cart-total">
                <strong>Total:</strong>
                <span id="cartTotal">0 Kz</span>
            </div>
            <button id="pdfBtn" class="btn-primary">
                <i class="ph-bold ph-download"></i> PDF
            </button>
            <button id="whatsappBtn" class="btn-primary btn-whatsapp">
                <i class="ph-bold ph-whatsapp-logo"></i> WhatsApp
            </button>
        </div>
    </div>

    <!-- QR Code Modal -->
    <div id="qrModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeQRModal()">✕</button>
            <h2>QR Code do Menu</h2>
            <div id="qrCode" class="qr-code-container"></div>
            <p>Escaneie para acessar o menu</p>
        </div>
    </div>

    <!-- Cart Overlay -->
    <div id="cartOverlay" class="cart-overlay" onclick="toggleCart()"></div>

    <!-- Footer -->
    <footer>
        <p><i class="ph-bold ph-map-pin"></i> Localização: Camama 1 - Shopping Popular, Luanda, Angola</p>
        <p><i class="ph-bold ph-phone"></i> Telefone: +244 950 671 427</p>
        <p><i class="ph-bold ph-clock"></i> Horário: Segunda-feira à Domingo 11h às 01h</p>
        <p><i class="ph-bold ph-instagram-logo"></i> Siga-nos: @eurekalounge</p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/search.js"></script>
    <script src="js/qrcode.js"></script>
    <script src="js/pdf.js"></script>
    <script src="js/whatsapp.js"></script>
</body>
</html>
