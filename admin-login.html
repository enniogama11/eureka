<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Eureka Lounge</title>
    <link rel="icon" href="img/eurea.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #ffd700;
            --bg: #000000;
            --card-bg: #111111;
            --gradient: linear-gradient(135deg, #d4af37 0%, #ffd700 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 25% 25%, rgba(212, 175, 55, 0.1) 0%, transparent 50%),
                              radial-gradient(circle at 75% 75%, rgba(212, 175, 55, 0.05) 0%, transparent 50%);
            color: var(--gold);
            font-family: 'Roboto', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            background: linear-gradient(145deg, var(--card-bg) 0%, #1a1a1a 100%);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 15px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(212, 175, 55, 0.2);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header img {
            max-width: 80px;
            margin-bottom: 15px;
            border-radius: 10px;
        }

        .login-header h1 {
            font-family: 'Playfair Display', serif;
            color: var(--gold-light);
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .login-header p {
            color: rgba(212, 175, 55, 0.7);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: var(--gold);
            margin-bottom: 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            color: var(--gold);
            font-family: 'Roboto', sans-serif;
            font-size: 1rem;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            background: rgba(212, 175, 55, 0.1);
            border-color: var(--gold-light);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        input::placeholder {
            color: rgba(212, 175, 55, 0.5);
        }

        .login-button {
            width: 100%;
            padding: 12px;
            background: var(--gradient);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .login-button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }

        .login-button:active {
            transform: scale(0.98);
        }

        .error-message {
            background: #ff4444;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            animation: shake 0.3s ease;
        }

        .error-message.show {
            display: block;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: var(--gold);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .back-link a:hover {
            color: var(--gold-light);
        }

        .info-box {
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-size: 0.85rem;
            color: rgba(212, 175, 55, 0.7);
        }

        .info-box strong {
            color: var(--gold);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <img src="img/eurea.png" alt="Eureka Lounge">
            <h1>Admin Panel</h1>
            <p>Acesso Restrito</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Utilizador</label>
                <input 
                    type="text" 
                    id="username" 
                    placeholder="Digite o utilizador"
                    autocomplete="off"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Digite a senha"
                    autocomplete="off"
                    required
                >
            </div>

            <button type="submit" class="login-button">🔓 Entrar</button>
        </form>

        <div class="back-link">
            <a href="index.html">← Voltar ao Menu</a>
        </div>

        <div class="info-box">
            <strong>Credenciais Padrão:</strong><br>
            Utilizador: <code>admin</code><br>
            Senha: <code>eureka2024</code>
        </div>
    </div>

    <script>
        // Credenciais (em produção, isso seria verificado no servidor)
        const ADMIN_USERNAME = 'admin';
        const ADMIN_PASSWORD = 'eureka2024';

        function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');

            // Validar credenciais
            if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
                // Salvar token de autenticação no sessionStorage
                sessionStorage.setItem('eurekAdminAuth', 'true');
                sessionStorage.setItem('eurekAdminTime', Date.now());

                // Redirecionar para o painel admin
                window.location.href = 'admin.html';
            } else {
                // Mostrar erro
                errorMessage.textContent = '❌ Utilizador ou senha incorretos!';
                errorMessage.classList.add('show');

                // Limpar campos
                document.getElementById('password').value = '';
                document.getElementById('username').focus();

                // Remover mensagem de erro após 3 segundos
                setTimeout(() => {
                    errorMessage.classList.remove('show');
                }, 3000);
            }
        }

        // Focar no campo de utilizador ao carregar
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('username').focus();
        });
    </script>
</body>
</html>
